name: Build and Release

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  # Every pull request, whatever its base: stacked PRs target feature/* branches, and the top of
  # the stack carries the whole change, so it must run the full matrix before anything merges.
  pull_request:

# Least privilege: every job reads the repo only. The release job alone may write (spec R5).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    outputs:
      # Set by tag builds only (identical on every matrix leg); the release job reads it
      prerelease: ${{ steps.version.outputs.prerelease }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # Third-party actions are pinned to full commit SHAs (resolved from the tag shown)
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # A tag must be exactly v + package.json version, or the release would carry a feed
      # (latest*.yml) for a different version. Fails before anything is built.
      # codex:run npm test -- tests/unit/releaseVersion.test.ts
      - name: Check the tag matches package.json (tags)
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-version.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's sandbox needs
      - name: Allow the Chromium sandbox (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # Builds first; offline (tests/e2e/helpers). Linux has no display, so run under Xvfb.
      - name: End-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: npm run test:e2e

      - name: Upload e2e results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results-${{ runner.os }}
          path: test-results/
          retention-days: 7

      - name: Build
        run: npm run build

      # The rpm target needs rpmbuild
      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      # Packages only; the release job is the one place that publishes. Signing and notarization
      # run on release tag builds when their secrets are configured, and never on branch pushes or
      # pull requests (nothing they build is published).
      - name: Package
        shell: bash
        env:
          CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          WIN_CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          # A tag build that has the macOS certificate must come out signed: forceCodeSigning makes a
          # missing, expired or wrong certificate fail here instead of shipping an unsigned app.
          # Notarization is enforced by the verify step below (electron-builder 26 only warns when
          # the notarization credentials are missing).
          MAC_FORCE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS' && secrets.MAC_CSC_LINK != '' }}
        run: |
          set -euo pipefail
          # electron-builder treats an empty CSC_LINK as set (and fails), so drop unset secrets
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          args=(--publish never)
          if [ "$MAC_FORCE_SIGNING" = "true" ]; then args+=(-c.mac.forceCodeSigning=true); fi
          # --no: use the electron-builder npm ci installed from the lockfile, never fetch one
          npx --no -- electron-builder "${args[@]}"

      # A signed release must pass Gatekeeper the way a downloaded copy would: a valid Developer ID
      # signature, notarized, with the ticket stapled. This is the notarization gate. Nothing runs
      # that a secret could leak through: it only reads the built apps.
      - name: Verify the macOS signature and notarization (signed tag build)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          MAC_SIGNED: ${{ secrets.MAC_CSC_LINK != '' }}
        run: |
          set -euo pipefail
          if [ "$MAC_SIGNED" != "true" ]; then
            echo "MAC_CSC_LINK is not configured: the macOS build is unsigned and its update feed is withheld below"
            exit 0
          fi
          shopt -s nullglob
          apps=(release/mac/*.app release/mac-arm64/*.app)
          if [ "${#apps[@]}" -ne 2 ]; then
            echo "::error title=macOS verification::expected the x64 and arm64 apps, found ${#apps[@]}"
            exit 1
          fi
          for app in "${apps[@]}"; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            # spctl exits non-zero on rejection; the grep then pins the source to a notarized
            # Developer ID signature (a plain Developer ID pass is not enough for a download)
            assessment=$(spctl --assess --type execute --verbose=2 "$app" 2>&1)
            echo "$assessment"
            grep -q 'source=Notarized Developer ID' <<<"$assessment"
            xcrun stapler validate "$app"
          done

      # The packaged app must start. The fuses (asar integrity, only-load-from-asar) and the hardened
      # runtime apply only to a packaged build, which the e2e tests never run, and Playwright cannot
      # drive it (the --inspect fuse is off). So this launches the native-arch app on a throwaway
      # profile and checks it is still running after Chromium has written that profile. A first run
      # shows the local welcome dialog and loads no site. The packaged build's automatic update check
      # reads only GitHub's public releases, and the app stays up whatever it finds. By this step the
      # signing keychain is gone (electron-builder deletes it when the build finishes) and no secret
      # is in this step's environment.
      - name: Smoke-launch the packaged app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) dir=release/mac-arm64 ;;
            *) dir=release/mac ;;
          esac
          shopt -s nullglob
          apps=("$dir"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "::error title=Smoke launch::expected one app in $dir, found ${#apps[@]}"
            exit 1
          fi
          bin="${apps[0]}/Contents/MacOS/Jira Desktop"
          profile=$(mktemp -d "$RUNNER_TEMP/smoke-profile.XXXXXX")
          log="$RUNNER_TEMP/smoke.log"
          JIRA_DESKTOP_USER_DATA_DIR="$profile" "$bin" >"$log" 2>&1 &
          pid=$!
          started=false
          for _ in $(seq 1 60); do
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            if [ -f "$profile/Local State" ]; then started=true; break; fi
            sleep 1
          done
          # A few more seconds, so a crash just after startup still fails the step
          if [ "$started" = true ]; then sleep 5; fi
          alive=false
          if kill -0 "$pid" 2>/dev/null; then alive=true; fi
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          if [ "$started" != true ] || [ "$alive" != true ]; then
            echo "::error title=Smoke launch::the packaged app did not stay running (profile written: $started, alive: $alive)"
            cat "$log"
            exit 1
          fi
          echo "The packaged app started and stayed running"

      # Squirrel.Mac only installs an update signed to match the running app, so an ad-hoc signed
      # mac build must not ship an update feed: every in-app "Update Now" would fail. Without
      # signing, the release keeps the mac .dmg/.zip as manual downloads but drops latest-mac.yml
      # and the zip blockmaps; mac clients then find no update. Windows and Linux are unaffected.
      - name: Withhold the macOS update feed (unsigned tag build)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          MAC_SIGNED: ${{ secrets.MAC_CSC_LINK != '' }}
        run: |
          if [ "$MAC_SIGNED" = "true" ]; then
            echo "macOS build is signed; publishing latest-mac.yml"
            exit 0
          fi
          rm -f release/latest-mac.yml release/*.zip.blockmap
          echo "::warning title=macOS update feed withheld::MAC_CSC_LINK is not configured, so the macOS build is ad-hoc signed and cannot install as an in-app update. latest-mac.yml and the zip blockmaps are not published; mac users must download this release manually."

      # Installers plus the updater metadata (latest*.yml) and blockmaps for differential updates
      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/latest*.yml
            release/*.blockmap

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/latest*.yml
            release/*.blockmap
          fail_on_unmatched_files: true
          draft: false
          # From the semver pre-release part of the checked version (build job), not a ref substring
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
