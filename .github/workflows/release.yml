name: Build and Release

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  # Every pull request, whatever its base: stacked PRs target feature/* branches, and the top of
  # the stack carries the whole change, so it must run the full matrix before anything merges.
  pull_request:

# Least privilege: every job reads the repo only. The release job alone may write (spec R5).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    outputs:
      # Set by tag builds only (identical on every matrix leg); the release job reads it
      prerelease: ${{ steps.version.outputs.prerelease }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # Third-party actions are pinned to full commit SHAs (resolved from the tag shown)
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # A tag must be exactly v + package.json version, or the release would carry a feed
      # (latest*.yml) for a different version. Fails before anything is built.
      # codex:run npm test -- tests/unit/releaseVersion.test.ts
      - name: Check the tag matches package.json (tags)
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-version.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's sandbox needs
      - name: Allow the Chromium sandbox (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # Builds first; offline (tests/e2e/helpers). Linux has no display, so run under Xvfb.
      - name: DIAG netlog (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/netlog"
          E2E_NETLOG_DIR="$RUNNER_TEMP/netlog" xvfb-run -a npx playwright test tests/e2e/smoke.spec.ts || true
          ls -la "$RUNNER_TEMP/netlog"
          for f in "$RUNNER_TEMP"/netlog/*.json; do echo "== $f"; grep -oE '"(url|original_url|location)":"[^"]*(gvt1|gstatic|google)[^"]*"' "$f" | sort | uniq -c; done
          python3 - "$RUNNER_TEMP/netlog" <<'PY'
          import json,sys,glob
          for f in glob.glob(sys.argv[1]+'/*.json'):
              try: d=json.load(open(f))
              except Exception as e:
                  txt=open(f).read(); d=json.loads(txt.rstrip().rstrip(',')+']}') if not txt.rstrip().endswith('}') else json.loads(txt)
              types={v:k for k,v in d['constants']['logEventTypes'].items()}
              srcs={v:k for k,v in d['constants']['logSourceType'].items()}
              hits=set()
              for e in d['events']:
                  p=json.dumps(e.get('params',{}))
                  if 'gvt1' in p: hits.add(e['source']['id'])
              for e in d['events']:
                  if e['source']['id'] in hits:
                      print(srcs.get(e['source']['type']), types.get(e['type']), json.dumps(e.get('params',{}))[:400])
          PY
      - name: End-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: npm run test:e2e

      - name: Upload e2e results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results-${{ runner.os }}
          path: test-results/
          retention-days: 7

      - name: Build
        run: npm run build

      # The rpm target needs rpmbuild
      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      # Packages only; the release job is the one place that publishes. Signing and notarization
      # run on release tag builds when their secrets are configured, and never on branch pushes or
      # pull requests (nothing they build is published).
      - name: Package
        shell: bash
        env:
          CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          WIN_CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: |
          # electron-builder treats an empty CSC_LINK as set (and fails), so drop unset secrets
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          npx electron-builder --publish never

      # Squirrel.Mac only installs an update signed to match the running app, so an ad-hoc signed
      # mac build must not ship an update feed: every in-app "Update Now" would fail. Without
      # signing, the release keeps the mac .dmg/.zip as manual downloads but drops latest-mac.yml
      # and the zip blockmaps; mac clients then find no update. Windows and Linux are unaffected.
      - name: Withhold the macOS update feed (unsigned tag build)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          MAC_SIGNED: ${{ secrets.MAC_CSC_LINK != '' }}
        run: |
          if [ "$MAC_SIGNED" = "true" ]; then
            echo "macOS build is signed; publishing latest-mac.yml"
            exit 0
          fi
          rm -f release/latest-mac.yml release/*.zip.blockmap
          echo "::warning title=macOS update feed withheld::MAC_CSC_LINK is not configured, so the macOS build is ad-hoc signed and cannot install as an in-app update. latest-mac.yml and the zip blockmaps are not published; mac users must download this release manually."

      # Installers plus the updater metadata (latest*.yml) and blockmaps for differential updates
      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/latest*.yml
            release/*.blockmap

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/latest*.yml
            release/*.blockmap
          fail_on_unmatched_files: true
          draft: false
          # From the semver pre-release part of the checked version (build job), not a ref substring
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
