name: Build and Release

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  # Every pull request, whatever its base: stacked PRs target feature/* branches, and the top of
  # the stack carries the whole change, so it must run the full matrix before anything merges.
  pull_request:

# Least privilege: every job reads the repo only. The release job alone may write (spec R5).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    outputs:
      # Set by tag builds only (identical on every matrix leg); the release job reads it
      prerelease: ${{ steps.version.outputs.prerelease }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # Third-party actions are pinned to full commit SHAs (resolved from the tag shown)
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # A tag must be exactly v + package.json version, or the release would carry a feed
      # (latest*.yml) for a different version. Fails before anything is built.
      # codex:run npm test -- tests/unit/releaseVersion.test.ts
      - name: Check the tag matches package.json (tags)
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-version.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's sandbox needs
      - name: Allow the Chromium sandbox (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # Builds first; offline (tests/e2e/helpers). Linux has no display, so run under Xvfb.
      - name: End-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: npm run test:e2e

      - name: Upload e2e results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results-${{ runner.os }}
          path: test-results/
          retention-days: 7

      - name: Build
        run: npm run build

      # The rpm target needs rpmbuild
      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      # Packages only; the release job is the one place that publishes. This job runs dependency
      # install scripts, the test suites and builds from unreviewed pull requests, so it never holds
      # the macOS signing secrets: here the Mac build is packaged unsigned, for the smoke launch and
      # as a PR artifact. The released Mac build comes from the package-mac-release job below.
      # Windows signing still runs here on v* tag builds when its secrets are configured.
      - name: Package
        shell: bash
        env:
          WIN_CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          # Never pick up a signing identity from the runner's keychain
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          # electron-builder treats an empty CSC_LINK as set (and fails), so drop unset secrets
          for name in WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          # --no: use the electron-builder npm ci installed from the lockfile, never fetch one
          npx --no -- electron-builder --publish never

      # The only check of the fused, hardened packaged app (scripts/mac-smoke-launch.sh says why).
      # Launches the native-arch build; macos-latest is arm64 with no Rosetta for the x64 one.
      - name: Smoke-launch the packaged app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) app="release/mac-arm64/Jira Desktop.app" ;;
            *) app="release/mac/Jira Desktop.app" ;;
          esac
          scripts/mac-smoke-launch.sh "$app"

      # Installers plus the updater metadata (latest*.yml) and blockmaps for differential updates.
      # On v* tags the release job takes Linux and Windows files from here and the Mac files from
      # package-mac-release, each by its own file patterns.
      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/latest*.yml
            release/*.blockmap

  # Builds the app's JavaScript (dist/) for the macOS release, on a runner with no secrets. The
  # bundlers (electron-vite, vite, rollup, esbuild) are third-party code; running them here means
  # nothing they start can still be alive on the runner that signs (package-mac-release).
  build-mac-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Upload the build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-release-dist
          if-no-files-found: error
          retention-days: 1
          path: dist/

  # The released macOS build, on v* tag pushes only. A job of its own so the signing certificate
  # and the notarization key never share a runner with dependency install scripts, the test suites,
  # the bundlers or pull request code: it installs with --ignore-scripts, takes dist/ from
  # build-mac-release, then packages, smoke-launches and verifies, nothing else. electron-builder
  # itself necessarily runs here. Its secrets belong in the `release` environment, which the owner
  # limits to v* tags with a required reviewer, next to a ruleset that lets only the owner create
  # v* tags (CLAUDE.md, "macOS signing setup"). Those settings, not this file, are the protection:
  # anyone who can push could edit the checks below on their own commit.
  package-mac-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-mac-release]
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the tag can be checked against main
          fetch-depth: 0

      # Releases are tagged on main after dev is merged (CLAUDE.md, Git workflow). Catches a tag
      # pushed on the wrong commit by mistake.
      - name: Check the tag is on main
        shell: bash
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=Release tag not on main::$GITHUB_REF_NAME ($GITHUB_SHA) is not on origin/main. Tag a commit that is on main."
            exit 1
          fi

      # No npm cache in the job that holds the signing secrets
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # --ignore-scripts: no dependency code runs at install time on this runner. electron-builder
      # downloads Electron itself, so the electron package's own postinstall is not needed. The app
      # still needs its runtime dependencies (electron-updater) in node_modules to package them.
      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download the build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mac-release-dist
          path: dist

      # Signed and notarized when MAC_CSC_LINK is set; forceCodeSigning then turns a missing, expired
      # or wrong certificate into a failed build. Notarization uses an App Store Connect API key,
      # written to a private temp file for this step only. electron-builder 26 only warns when the
      # notarization credentials are missing, so the verify step is the notarization gate.
      # Never add `set -x` or DEBUG=electron-builder here: they would print secret material.
      - name: Package (macOS release)
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MAC_SIGNING_REQUIRED: ${{ vars.MAC_SIGNING_REQUIRED }}
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          if [ -z "${CSC_LINK:-}" ]; then
            if [ "$MAC_SIGNING_REQUIRED" = "true" ]; then
              echo "::error title=macOS signing required::MAC_SIGNING_REQUIRED is true but MAC_CSC_LINK is not set for the release environment"
              exit 1
            fi
            echo "::warning title=Unsigned macOS release::MAC_CSC_LINK is not set; the macOS build is unsigned and its update feed will be withheld"
            # Nothing secret reaches electron-builder on this path, even if some secrets are set
            unset CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER
            CSC_IDENTITY_AUTO_DISCOVERY=false ./node_modules/.bin/electron-builder --mac --publish never
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/notarize-api-key.p8"
          trap 'rm -f "$key"' EXIT
          if [ -n "${APPLE_API_KEY_P8:-}" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
            export APPLE_API_KEY="$key"
          fi
          unset APPLE_API_KEY_P8
          ./node_modules/.bin/electron-builder --mac --publish never -c.mac.forceCodeSigning=true

      # The signed (or unsigned) release build must start too: entitlement or signature problems
      # under the hardened runtime only show up here. Runs with a stripped environment after the
      # Package step: its secrets were scoped to that step, the notarization key file is deleted,
      # and electron-builder deletes its temporary signing keychain when the build finishes. It runs
      # before the verify step, so anything the launched app could change is checked afterwards.
      - name: Smoke-launch the release app
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) app="release/mac-arm64/Jira Desktop.app" ;;
            *) app="release/mac/Jira Desktop.app" ;;
          esac
          scripts/mac-smoke-launch.sh "$app"

      # A signed release must pass Gatekeeper the way a downloaded copy would. This checks what
      # ships, not the build folder: the app inside each .dmg and each .zip (the updater's file)
      # must have a valid Developer ID signature, be notarized and carry the stapled ticket.
      # Only reads the built files.
      - name: Verify the shipped macOS apps (signed release)
        shell: bash
        env:
          MAC_SIGNED: ${{ secrets.MAC_CSC_LINK != '' }}
        run: |
          set -euo pipefail
          if [ "$MAC_SIGNED" != "true" ]; then
            echo "MAC_CSC_LINK is not set: unsigned release, nothing to verify (its update feed is withheld below)"
            exit 0
          fi
          verify_app() {
            local app=$1 assessment
            if [ ! -d "$app" ]; then
              echo "::error title=macOS verification::missing $app"
              return 1
            fi
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            # spctl exits non-zero on a rejection; the exact line pins the source to a notarized
            # Developer ID signature (Developer ID alone is not enough for a download)
            assessment=$(spctl --assess --type execute --verbose=2 "$app" 2>&1)
            echo "$assessment"
            grep -qx 'source=Notarized Developer ID' <<<"$assessment"
            xcrun stapler validate "$app"
          }
          shopt -s nullglob
          dmgs=(release/*.dmg)
          zips=(release/*.zip)
          if [ "${#dmgs[@]}" -ne 2 ] || [ "${#zips[@]}" -ne 2 ]; then
            echo "::error title=macOS verification::expected 2 .dmg and 2 .zip files (x64 and arm64), found ${#dmgs[@]} and ${#zips[@]}"
            exit 1
          fi
          if [ ! -f release/latest-mac.yml ]; then
            echo "::error title=macOS verification::a signed build must produce latest-mac.yml"
            exit 1
          fi
          work=$(mktemp -d "$RUNNER_TEMP/verify.XXXXXX")
          mounts=()
          cleanup() {
            local m
            # ${a[@]+...}: an empty array is "unbound" under set -u in bash 3.2
            for m in ${mounts[@]+"${mounts[@]}"}; do hdiutil detach -quiet "$m" || hdiutil detach -force -quiet "$m" || true; done
          }
          trap cleanup EXIT
          i=0
          for dmg in "${dmgs[@]}"; do
            i=$((i + 1))
            mnt="$work/dmg-$i"
            mkdir "$mnt"
            hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mnt" "$dmg" >/dev/null
            mounts+=("$mnt")
            verify_app "$mnt/Jira Desktop.app"
          done
          for zip in "${zips[@]}"; do
            i=$((i + 1))
            out="$work/zip-$i"
            mkdir "$out"
            ditto -x -k "$zip" "$out"
            verify_app "$out/Jira Desktop.app"
          done
          # The update feed must describe exactly these files: this tag's version, and each verified
          # zip by name and by the SHA-512 electron-updater checks before installing
          feed=release/latest-mac.yml
          if ! grep -qx "version: ${GITHUB_REF_NAME#v}" "$feed"; then
            echo "::error title=macOS verification::$feed is not for version ${GITHUB_REF_NAME#v}"
            exit 1
          fi
          for zip in "${zips[@]}"; do
            hash=$(openssl dgst -sha512 -binary "$zip" | base64 | tr -d '\n')
            name=$(basename "$zip")
            if ! grep -qF "url: $name" "$feed" || ! grep -qF "sha512: $hash" "$feed"; then
              echo "::error title=macOS verification::$feed does not list $name with its SHA-512"
              exit 1
            fi
          done

      # Squirrel.Mac only installs an update signed to match the running app, so an unsigned mac
      # build must not ship an update feed: every in-app "Update Now" would fail. Without signing,
      # the release keeps the .dmg/.zip as manual downloads but drops latest-mac.yml and the zip
      # blockmaps; the app's Check for Updates then offers the releases page (UpdateController).
      - name: Withhold the macOS update feed (unsigned release)
        shell: bash
        env:
          MAC_SIGNED: ${{ secrets.MAC_CSC_LINK != '' }}
        run: |
          set -euo pipefail
          if [ "$MAC_SIGNED" = "true" ]; then
            echo "macOS build is signed and verified; publishing latest-mac.yml"
            exit 0
          fi
          rm -f release/latest-mac.yml release/*.zip.blockmap
          echo "::warning title=macOS update feed withheld::MAC_CSC_LINK is not set, so the macOS build is unsigned and cannot install as an in-app update. latest-mac.yml and the zip blockmaps are not published; mac users must download this release manually."

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macOS-signed
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
            release/*.blockmap

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, package-mac-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      # Each platform's files are downloaded apart and taken by that platform's own patterns, so
      # no leg can add a file for another platform (a latest-mac.yml from the Linux leg, say).
      # The Mac files come only from package-mac-release, never from the unsigned matrix leg.
      - name: Download Linux packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-Linux
          path: artifacts/linux

      - name: Download Windows packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-Windows
          path: artifacts/windows

      - name: Download macOS packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macOS-signed
          path: artifacts/mac

      - name: Assemble the release files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir release
          # take <dir> <required|optional> <pattern>...: copy matching files into release/, refusing
          # to overwrite one that another platform already supplied
          take() {
            local dir=$1 need=$2 pattern file
            shift 2
            for pattern in "$@"; do
              # The pattern is a constant from this step and must glob. A pattern with no wildcard
              # (latest.yml) stays as a literal even under nullglob, so keep only files that exist.
              local files=() candidate
              # shellcheck disable=SC2206
              local candidates=("$dir"/$pattern)
              for candidate in ${candidates[@]+"${candidates[@]}"}; do
                if [ -f "$candidate" ]; then files+=("$candidate"); fi
              done
              if [ "${#files[@]}" -eq 0 ]; then
                if [ "$need" = required ]; then
                  echo "::error title=Release files::no $pattern in $dir"
                  exit 1
                fi
                continue
              fi
              for file in "${files[@]}"; do
                if [ -e "release/$(basename "$file")" ]; then
                  echo "::error title=Release files::two platforms supplied $(basename "$file")"
                  exit 1
                fi
                cp -- "$file" release/
              done
            done
          }
          take artifacts/linux required '*.AppImage' '*.deb' '*.rpm' 'latest-linux.yml'
          take artifacts/linux optional '*.AppImage.blockmap'
          take artifacts/windows required '*.exe' 'latest.yml'
          take artifacts/windows optional '*.exe.blockmap'
          take artifacts/mac required '*.dmg' '*.zip'
          # Present only for a signed, verified build (package-mac-release withholds them otherwise)
          take artifacts/mac optional 'latest-mac.yml' '*.dmg.blockmap' '*.zip.blockmap'
          ls -l release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/latest*.yml
            release/*.blockmap
          fail_on_unmatched_files: true
          draft: false
          # From the semver pre-release part of the checked version (build job), not a ref substring
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
